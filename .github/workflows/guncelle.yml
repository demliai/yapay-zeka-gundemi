name: Haberleri güncelle

on:
  schedule:
    # Her 3 saatte bir (UTC, dakika 17). GitHub yoğunlukta birkaç dakika geciktirebilir.
    - cron: "17 */3 * * *"
  workflow_dispatch: {}        # Actions sekmesinden "Run workflow" ile elle çalıştırma
  push:
    branches: [main]
    paths-ignore: ["haberler.json", "README.md"]   # tasarım/kaynak değişince siteyi yeniden yayınla

concurrency:
  group: haber-guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write          # yalnız haberler.json'u commit'lemek için
    outputs:
      degisti: ${{ steps.commit.outputs.degisti }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kaynakları oku, haberler.json üret
        run: python betik/guncelle.py

      - name: Değişiklik varsa commit'le
        id: commit
        run: |
          if git diff --quiet -- haberler.json && ! git ls-files --others --exclude-standard | grep -q '^haberler.json$'; then
            echo "Yeni haber yok, commit atlanıyor."
            echo "degisti=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add haberler.json
          git commit -m "Haberler güncellendi"
          git push
          echo "degisti=true" >> "$GITHUB_OUTPUT"

  yayinla:
    needs: guncelle
    # Yeni haber geldiyse, elle çalıştırıldıysa ya da kod değiştiyse yayınla.
    if: needs.guncelle.outputs.degisti == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # az önce commit'lenen haberler.json dahil

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: dagit
        uses: actions/deploy-pages@v4
